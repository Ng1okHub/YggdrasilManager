plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace 'ng1ok.yggdrasilmanager'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "ng1ok.yggdrasilmanager"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
        aidl = true
    }
    sourceSets {
        main {
            // Generated by buildYggdrasilSelfTest below.
            assets.srcDir(layout.buildDirectory.dir("generated/yggdrasilSelfTest/assets").get().asFile)
        }
    }
}

dependencies {
    implementation(platform(libs.compose.bom))
    implementation(libs.compose.ui)
    implementation(libs.compose.ui.tooling.preview)
    implementation(libs.compose.material3)
    implementation(libs.compose.material.icons.extended)
    implementation(libs.activity.compose)
    implementation(libs.navigation.compose)
    implementation(libs.lifecycle.viewmodel.compose)
    implementation(libs.lifecycle.runtime.ktx)
    implementation(libs.libsu.core)
    implementation(libs.libsu.service)
    implementation(libs.ktor.server.core)
    implementation(libs.ktor.server.cio)
    implementation(libs.ktor.server.websockets)
    implementation(libs.ktor.serialization.kotlinx.json)

    debugImplementation(libs.compose.ui.tooling)

    testImplementation(libs.junit)
    testImplementation(libs.coroutines.test)
    testImplementation(libs.mockk)
    testImplementation(libs.ktor.server.test.host)
    testImplementation(libs.ktor.client.websockets)
    androidTestImplementation(libs.ext.junit)
    androidTestImplementation(libs.espresso.core)
}

/*
 * yggdrasil_test.cpp is an arm64-only, zero-argument KPM self-test. It is not
 * part of the JNI library: the Manager ships it as an executable asset and
 * runs it through su, because several sections need root and the test must
 * own a standalone process (fork/ptrace/freeze).
 */
def selfTestAssetsDir = layout.buildDirectory.dir("generated/yggdrasilSelfTest/assets")
def selfTestNdkDirectory = androidComponents.sdkComponents.ndkDirectory

def buildYggdrasilSelfTest = tasks.register("buildYggdrasilSelfTest", Exec) {
    group = "build"
    description = "Builds the arm64-v8a Yggdrasil KPM self-test executable into app assets."

    def cppDir = file("src/main/cpp")
    def sourceFile = file("src/main/cpp/yggdrasil_test.cpp")
    def headerFile = file("src/main/cpp/yggdrasil.h")
    def formatHeaderFile = file("src/main/cpp/yggdrasil_syscall_format.h")
    def outputFile = selfTestAssetsDir.map { it.file("yggdrasil_test/arm64-v8a/yggdrasil_test") }

    inputs.file(sourceFile)
    inputs.file(headerFile)
    inputs.file(formatHeaderFile)
    inputs.property("ndkDirectory", selfTestNdkDirectory.map { it.asFile.absolutePath })
    outputs.file(outputFile)

    doFirst {
        def ndkDir = selfTestNdkDirectory.get().asFile
        def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
        def isWindows = osName.contains("windows")
        def hostTag = isWindows ? "windows-x86_64" : (osName.contains("mac") ? "darwin-x86_64" : "linux-x86_64")
        def compiler = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/bin/${isWindows ? 'clang++.exe' : 'clang++'}")
        if (!compiler.isFile()) {
            throw new GradleException("找不到 NDK clang++：${compiler}。請確認 Android NDK 已安裝。")
        }

        def output = outputFile.get().asFile
        output.parentFile.mkdirs()
        commandLine(
            compiler.absolutePath,
            "--target=aarch64-linux-android24",
            "-std=c++17",
            "-O2",
            "-fPIE",
            "-pie",
            "-static-libstdc++",
            "-I", cppDir.absolutePath,
            "-o", output.absolutePath,
            sourceFile.absolutePath
        )
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn(buildYggdrasilSelfTest)
}
