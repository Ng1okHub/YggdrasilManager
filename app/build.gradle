plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

def managerVersion = new Properties()
managerVersion.load(new StringReader(providers.fileContents(rootProject.layout.projectDirectory.file('version.properties')).asText.get()))
def managerVersionName = managerVersion.getProperty('versionName', '')
def managerVersionCode = managerVersion.getProperty('versionCode', '')
if (!(managerVersionName ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?/) ||
        !(managerVersionCode ==~ /[1-9]\d*/) || new BigInteger(managerVersionCode) > 2100000000) {
    throw new GradleException('Invalid version.properties: use SemVer without build metadata and versionCode 1..2100000000.')
}

def signingProperties = new Properties()
def signingPropertiesText = providers.fileContents(rootProject.layout.projectDirectory.file('keystore.properties')).asText.orElse('').get()
signingProperties.load(new StringReader(signingPropertiesText))
def signingValues = [
    storeFile: providers.environmentVariable('YGGDRASIL_KEYSTORE_FILE').orElse(signingProperties.getProperty('storeFile', '')).get(),
    storePassword: providers.environmentVariable('YGGDRASIL_KEYSTORE_PASSWORD').orElse(signingProperties.getProperty('storePassword', '')).get(),
    keyAlias: providers.environmentVariable('YGGDRASIL_KEY_ALIAS').orElse(signingProperties.getProperty('keyAlias', '')).get(),
    keyPassword: providers.environmentVariable('YGGDRASIL_KEY_PASSWORD').orElse(signingProperties.getProperty('keyPassword', '')).get()
]
def hasReleaseSigning = signingValues.values().every { !it.isBlank() }

android {
    namespace 'ng1ok.yggdrasilmanager'
    ndkVersion '28.2.13676358'
    buildToolsVersion '36.0.0'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "ng1ok.yggdrasilmanager"
        minSdk 24
        targetSdk 36
        versionCode managerVersionCode.toInteger()
        versionName managerVersionName

        // The KPM ABI and bundled self-test target arm64; other APK ABIs cannot use them.
        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Root services and JNI use reflection/name lookup; keep shrinking disabled until tested on a device.
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
        aidl = true
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Rejects release builds without explicit signing credentials.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is required. Run node scripts/generate-signing-key.mjs or configure all YGGDRASIL_KEYSTORE_* / YGGDRASIL_KEY_* variables. See docs/release/releasing.en.md.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(verifyReleaseSigning)
}

