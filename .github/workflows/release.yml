name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          gradle-cache-disabled: 'true'
      - name: Validate release tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo 'Run Release from a version tag.' >&2; exit 1; }
          node scripts/version.mjs check-tag "$GITHUB_REF_NAME"
          node --test scripts/test/*.test.mjs
      - name: Test and rebuild browser console
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm test --prefix frontend
          npm run sync:android --prefix frontend
      - name: Restore release signing key
        shell: bash
        env:
          YGGDRASIL_KEYSTORE_BASE64: ${{ secrets.YGGDRASIL_KEYSTORE_BASE64 }}
          YGGDRASIL_KEYSTORE_PASSWORD: ${{ secrets.YGGDRASIL_KEYSTORE_PASSWORD }}
          YGGDRASIL_KEY_ALIAS: ${{ secrets.YGGDRASIL_KEY_ALIAS }}
          YGGDRASIL_KEY_PASSWORD: ${{ secrets.YGGDRASIL_KEY_PASSWORD }}
        run: |
          for name in YGGDRASIL_KEYSTORE_BASE64 YGGDRASIL_KEYSTORE_PASSWORD YGGDRASIL_KEY_ALIAS YGGDRASIL_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing GitHub Actions secret: $name" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$YGGDRASIL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yggdrasilmanager-release.p12"
          echo "YGGDRASIL_KEYSTORE_FILE=$RUNNER_TEMP/yggdrasilmanager-release.p12" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release
        env:
          YGGDRASIL_KEYSTORE_PASSWORD: ${{ secrets.YGGDRASIL_KEYSTORE_PASSWORD }}
          YGGDRASIL_KEY_ALIAS: ${{ secrets.YGGDRASIL_KEY_ALIAS }}
          YGGDRASIL_KEY_PASSWORD: ${{ secrets.YGGDRASIL_KEY_PASSWORD }}
        run: bash ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-configuration-cache --stacktrace --console=plain
      - name: Verify certificate and package release
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          expected=$(openssl x509 -in signing/release-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
          test -n "$expected" && test "$expected" = "$actual" || { echo 'Release certificate mismatch.' >&2; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          mkdir -p dist
          cp "$apk" "dist/YggdrasilManager-$GITHUB_REF_NAME-arm64-v8a.apk"
          cp signing/release-certificate.pem dist/YggdrasilManager-signing-certificate.pem
          cd dist
          sha256sum ./*.apk ./*.pem > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-reports
          path: app/build/reports/
          retention-days: 7
      - name: Remove restored private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yggdrasilmanager-release.p12"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --title "YggdrasilManager $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
