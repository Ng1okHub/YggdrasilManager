name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check version management
        run: |
          node scripts/version.mjs show
          node --test scripts/test/*.test.mjs
      - name: Test and rebuild browser console
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm test --prefix frontend
          npm run sync:android --prefix frontend
      # PRs, including forks, build release with a disposable key and never receive release secrets.
      - name: Generate disposable CI signing key
        run: node scripts/generate-signing-key.mjs
      - name: Test, lint and build both variants
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YggdrasilManager-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: app/build/reports/
          retention-days: 7
