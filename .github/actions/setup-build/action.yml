name: Set up build toolchain
description: Install the pinned Android toolchain, Java and Node.js.
inputs:
  gradle-cache-read-only:
    description: Prevent untrusted changes from writing the Gradle cache.
    default: 'false'
  gradle-cache-disabled:
    description: Disable persistent caches for builds using the release signing key.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        cache-disabled: ${{ inputs.gradle-cache-disabled }}
    - name: Install Android packages
      shell: bash
      run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
